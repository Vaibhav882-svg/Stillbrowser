
name: Build Still Browser APK

on:
  workflow_dispatch:
  push:
    paths:
      - "StillBrowser_Spatial_WebView_QA.zip"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept licenses and install Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found in $ANDROID_HOME"
            exit 1
          fi

          echo "Using: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true

          yes | "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file unzip \
            pkg-config patchelf \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Extract project ZIP
        run: |
          test -f StillBrowser_Spatial_WebView_QA.zip
          mkdir -p extracted
          unzip -q StillBrowser_Spatial_WebView_QA.zip -d extracted

          echo "Project files:"
          find extracted -maxdepth 4 \
            \( -name package.json -o -name tauri.conf.json -o -name Cargo.toml \) \
            -print

          test -f extracted/RustTauriBrowser/package.json
          test -f extracted/RustTauriBrowser/src-tauri/tauri.conf.json

      - name: Install JavaScript dependencies
        working-directory: extracted/RustTauriBrowser
        run: npm install

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Initialize Android project
        working-directory: extracted/RustTauriBrowser
        run: npm run tauri -- android init

      - name: Build frontend
        working-directory: extracted/RustTauriBrowser
        run: npm run build

      - name: Build Android APK
        working-directory: extracted/RustTauriBrowser
        run: npm run tauri -- android build --apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: StillBrowser-Android-APK
          path: extracted/RustTauriBrowser/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
          
