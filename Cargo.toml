[package]
name = "still-browser"
version = "0.1.0"
description = "Minimal Rust and Tauri browser shell"
authors = ["Still Browser"]
edition = "2021"

[lib]
name = "still_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
url = "2"

tauri-plugin-browser = { path = "plugins/tauri-plugin-browser" }
