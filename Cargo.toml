[package]
name = "tauri-plugin-browser"
version = "0.1.0"
description = "Native Android WebView browser overlay for Still Browser"
authors = ["Still Browser"]
edition = "2021"
links = "tauri-plugin-browser"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
